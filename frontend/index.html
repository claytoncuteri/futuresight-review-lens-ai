<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReviewLens AI: answers only from real Google reviews</title>
    <meta
      name="description"
      content="Load a business's Google Maps reviews by link or CSV, then ask questions. Answers come only from those reviews, with exact quotes."
    />
    <!-- %SITE_URL% is replaced at build time from VITE_SITE_URL (see vite.config.js). -->
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReviewLens AI" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="ReviewLens AI: answers only from real Google reviews" />
    <meta
      property="og:description"
      content="Load a business's Google Maps reviews by link or CSV, then ask questions. Answers come only from those reviews, with exact quotes."
    />
    <meta property="og:image" content="%SITE_URL%/og/home.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ReviewLens AI: answers only from real Google reviews. A chat answer citing a quoted review."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReviewLens AI: answers only from real Google reviews" />
    <meta
      name="twitter:description"
      content="Load a business's Google Maps reviews by link or CSV, then ask questions. Answers come only from those reviews, with exact quotes."
    />
    <meta name="twitter:image" content="%SITE_URL%/og/home.png" />
    <meta
      name="twitter:image:alt"
      content="ReviewLens AI: answers only from real Google reviews. A chat answer citing a quoted review."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
